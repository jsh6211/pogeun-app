workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate full Flutter project structure
        script: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml

          cd ..
          rm -rf clone
          flutter create --org com.pogeun --project-name pogeun_app clone
          cd clone

          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml

          # gradle.properties에 compileSdkVersion과 targetSdkVersion 속성을 전역(Global)으로 추가
          echo "android.compileSdkVersion=34" >> android/gradle.properties
          echo "android.targetSdkVersion=34" >> android/gradle.properties

          # Python을 사용해 Flutter가 생성한 app/build.gradle 설정 최신화
          python3 -c "
          import os

          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              # flutter.compileSdkVersion 구문을 숫자 34로 직접 교체
              content = content.replace('flutter.compileSdkVersion', '34')
              content = content.replace('flutter.targetSdkVersion', '34')

              with open(gradle_path, 'w') as f:
                  f.write(content)
          "
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
