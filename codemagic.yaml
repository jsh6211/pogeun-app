workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate full Flutter project structure & Fix compileSdk
        script: |
          # 1. 백업
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml

          # 2. 프로젝트 재생성
          cd ..
          rm -rf clone
          flutter create --org com.pogeun --project-name pogeun_app clone
          cd clone

          # 3. 소스코드 복원
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml

          # 4. Python 스크립트로 build.gradle 내 compileSdk / targetSdk / minSdk 강제 수정
          python3 -c "
          import re, os

          gradle_path = 'android/app/build.gradle'
          if not os.path.exists(gradle_path):
              gradle_path = 'android/app/build.gradle.kts'

          with open(gradle_path, 'r') as f:
              content = f.read()

          # compileSdk / compileSdkVersion을 34로 교체
          content = re.sub(r'compileSdk(Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
          content = re.sub(r'compileSdk(Version)?\s*=?\s*\d+', 'compileSdk = 34', content)
          content = re.sub(r'targetSdk(Version)?\s*=?\s*flutter\.targetSdkVersion', 'targetSdk = 34', content)

          with open(gradle_path, 'w') as f:
              f.write(content)

          print('Successfully updated android build configuration to SDK 34')
          "
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
