workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate full Flutter project structure
        script: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml

          cd ..
          rm -rf clone
          flutter create --org com.pogeun --project-name pogeun_app clone
          cd clone

          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK with SDK 34
        script: |
          flutter build apk --release --extra-front-end-options=--no-implicit-casts --build-number=1 --build-name=1.0.0 --target-platform=android-arm64 --config-only
          
          # Gradle 속성을 통해 compileSdkVersion 및 targetSdkVersion 강제 적용
          cd android
          ./gradlew assembleRelease -Pandroid.compileSdkVersion=34 -Pandroid.targetSdkVersion=34
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - build/app/outputs/flutter-apk/*.apk
