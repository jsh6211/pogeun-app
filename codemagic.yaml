workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate full Flutter project structure
        script: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml

          cd ..
          rm -rf clone
          flutter create --org com.pogeun --project-name pogeun_app clone
          cd clone

          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml

          # 루트 build.gradle에 모든 subproject(flutter_tts 등)의 compileSdkVersion을 34로 세팅하는 코드 주입
          python3 -c "
          import os

          # 1. 앱 레벨 build.gradle 수정
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  txt = f.read()
              txt = txt.replace('flutter.compileSdkVersion', '34')
              txt = txt.replace('flutter.targetSdkVersion', '34')
              with open(gradle_path, 'w') as f:
                  f.write(txt)

          # 2. 루트 레벨 build.gradle 수정 (flutter_tts 등 의존성 모듈 SDK 강제 상승)
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              override_code = '''
          subprojects {
              subproject ->
                  afterEvaluate {
                      if (subproject.hasProperty('android')) {
                          subproject.android {
                              compileSdkVersion 34
                          }
                      }
                  }
          }
          '''
              with open(root_gradle, 'a') as f:
                  f.write(override_code)
          "
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
