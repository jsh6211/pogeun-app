workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate full Flutter project structure
        script: |
          # 백업용 임시 폴더에 작성한 파일 복사
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml

          # 안드로이드 구조를 포함한 완벽한 Flutter 프로젝트 생성
          cd ..
          rm -rf clone
          flutter create --org com.pogeun --project-name pogeun_app clone
          cd clone

          # 백업해둔 메인 코드 및 pubspec 파일 덮어쓰기
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
